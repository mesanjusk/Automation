# Render Blueprint — deploys both the worker and (optionally) the web app as
# Docker services built from the REPO ROOT, using apps/worker/Dockerfile and
# apps/web/Dockerfile. This is deliberate: this repo is an npm workspaces
# monorepo, and Render's native Node buildpack combined with a per-service
# "Root Directory" set to a subfolder does NOT reliably install root-level
# devDependencies (e.g. @types/node) or resolve sibling workspace packages —
# it was designed for single-package repos. Docker with a repo-root build
# context sidesteps that entirely: each Dockerfile COPYs the whole workspace
# and runs a single `npm install --workspaces --include-workspace-root`.
#
# If you deploy the web app on Vercel instead (recommended — see README),
# just remove/ignore the `web` service below and only apply the `worker` one.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo/branch. Fill in the secret env vars marked sync: false afterwards.
#
# --- Free plan caveat (worker) ----------------------------------------------
# Both services below are set to `plan: free`. Free Render Web Services spin
# down after ~15 minutes with no HTTP traffic and cold-start on the next
# request. That's fine for the dashboard (a user hitting the URL wakes it),
# but the WORKER is meant to run continuously and consume queued BullMQ jobs
# even when nothing is browsing the dashboard — if it's asleep when a task is
# enqueued, that task just sits in Redis until something wakes the service.
#
# Mitigation included in this repo: .github/workflows/keep-worker-warm.yml
# pings the worker's /health endpoint every 10 minutes via a free GitHub
# Actions schedule, keeping it from ever spinning down. Set a repo secret
# named WORKER_HEALTH_URL (Settings -> Secrets and variables -> Actions) to
# your deployed worker's health URL, e.g.
# https://browser-automation-worker.onrender.com/health, and enable the
# workflow. This keeps things running on the free plan; for anything beyond
# testing, moving just the worker to a paid plan (Starter, ~$7/mo at time of
# writing — check Render's current pricing) is the more reliable fix, since a
# GitHub Actions ping still means the worker was briefly asleep between pings.
# -----------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# If you MUST use Render's native Node runtime for the dashboard instead of
# Docker (the worker should stay on Docker — it needs the Playwright/Chromium
# system libraries baked into its base image), use this service definition.
# `npm ci` is load-bearing: unlike `npm install`, it wipes node_modules and
# installs exactly what package-lock.json says, which defeats the stale
# build-cache failure mode where a restored cache reports "up to date" and
# skips newly added dependencies. The root build also runs scripts/preflight.mjs
# first, which fails fast with a clear message if the tree is stale anyway.
#
#   - type: web
#     name: browser-automation-web-native
#     runtime: node
#     plan: starter
#     buildCommand: npm ci && npm run build --workspace=apps/web
#     startCommand: npm run start --workspace=apps/web
#     envVars:
#       - key: NODE_VERSION
#         value: "20"
#       ... (same envVars as the `web` service below)
# ---------------------------------------------------------------------------

services:
  - type: web
    name: browser-automation-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MAX_AI_ACTIONS
        value: "100"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: WORKER_ID
        value: worker-render-1
      - key: WORKER_PORT
        value: "4000"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: BROWSER_MAX_CONCURRENCY
        value: "3"

  # Optional: deploy the dashboard here too instead of Vercel.
  - type: web
    name: browser-automation-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      # Point at the worker service's /health so the dashboard's
      # "Worker status" card works, e.g.
      # https://browser-automation-worker.onrender.com/health
      - key: WORKER_HEALTH_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
